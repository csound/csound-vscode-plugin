<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-test' 'wasm-unsafe-eval' blob: data:; worker-src blob: data:; connect-src 'self' blob: data:;"><title>Csound runtime verification</title></head><body data-session="test"><h1>Csound 7 runtime verification</h1><p id="status" role="status"></p><button id="enable" hidden>Enable Audio &amp; Play</button><pre id="log"></pre><script nonce="test">

UNTIME CHECKS PASSED')}
